  <body>
    <main id="demo">
      <noscript>
        <h1>Ferrofluid</h1>
        <p>
          Two FFGL plugins for Resolume: a dish of ferrofluid in a
          photographer's studio that stands up in spikes on the beat, and an
          effect that hangs your clip above the same pool and breaks it up in
          its mirror. Three real fluids off their datasheets, a Helmholtz pair,
          one coil or three under the dish, and every spike the shape a solver
          found offline with the full nonlinear magnetostatics, rather than a
          cone somebody drew. The spikes jump up past onset, hang on below it
          and lie down at the fold, as the real stuff does.
        </p>
        <p>
          This demo runs the plugin's shaders and a port of its CPU half in your
          browser, so it needs JavaScript and WebGL2. The plugin itself, its
          source and its downloads are on
          <a href="https://github.com/stoatworks-labs/ferrofluid">its repository</a>.
        </p>
        <ul>
          <li><a href="https://stoatworks-labs.com/software/ferrofluid/">Project page and downloads</a></li>
